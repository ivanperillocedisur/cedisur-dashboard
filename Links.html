<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CEDISUR — Links Equipo de Ventas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap');

:root {
  --navy: #2B3A8A;
  --navy-light: #3d50b5;
  --bg: #F0F2F8;
  --muted: #6B74A0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Barlow', sans-serif; background: var(--bg); color: #1A1F3A;
  min-height: 100vh; min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.top {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  padding: 22px 20px 20px; color: #fff;
  box-shadow: 0 3px 14px rgba(43,58,138,.25);
  position: sticky; top: 0; z-index: 10;
  transform: translateZ(0);
}
.top h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px; font-weight: 800; letter-spacing: 2px; line-height: 1;
}
.top p {
  font-size: 11px; color: rgba(255,255,255,.65);
  margin-top: 4px; letter-spacing: .5px; text-transform: uppercase; font-weight: 500;
}
.wrap { max-width: 620px; margin: 0 auto; padding: 16px 12px 32px; }
.status { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 0; }
/* Por defecto (mobile): lista simple apilada, una tarjeta debajo de otra, cada una con su altura natural */
.cards { display: flex; flex-direction: column; gap: 12px; }

/* Recien en pantallas anchas (tablet/desktop) se pasa a grilla de 2 columnas */
@media (min-width: 600px) {
  .cards { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  .card.wide { grid-column: span 2; }
}
.card {
  position: relative; display: block; border-radius: 16px;
  padding: 18px 16px 16px; text-decoration: none; color: #fff;
  overflow: hidden; min-height: 150px; min-width: 0;
  word-wrap: break-word; overflow-wrap: break-word;
  box-shadow: 0 4px 14px rgba(0,0,0,.12);
  transition: transform .12s;
  transform: translateZ(0); /* evita glitch de render en scroll de iOS */
  -webkit-backface-visibility: hidden;
}
.card:active { transform: scale(.98); }
.card::before {
  content: ""; position: absolute; top: -30px; right: -40px;
  width: 140px; height: 140px; border-radius: 50%;
  background: var(--circulo, rgba(255,255,255,.10));
}
.card::after {
  content: ""; position: absolute; top: 30px; right: -10px;
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--circulo, rgba(255,255,255,.08));
}
.card-icon {
  height: 64px; min-width: 64px; max-width: 120px;
  width: fit-content; border-radius: 14px;
  background: rgba(255,255,255,.16);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px; position: relative; z-index: 1;
  overflow: hidden; padding: 0 4px;
}
.card-icon svg { width: 30px; height: 30px; flex-shrink: 0; }
.card-icon img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
.chev {
  position: absolute; top: 16px; right: 16px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,.22);
  display: flex; align-items: center; justify-content: center;
  z-index: 1;
}
.chev svg { width: 16px; height: 16px; }
.card-vig {
  display: inline-block; font-family: 'Barlow Condensed', sans-serif;
  font-size: 10.5px; font-weight: 700; letter-spacing: .6px;
  text-transform: uppercase; background: rgba(255,255,255,.20);
  padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
  position: relative; z-index: 1;
}
.card-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 21px; font-weight: 700; letter-spacing: .3px; line-height: 1.1;
  margin-bottom: 4px; position: relative; z-index: 1;
}
.card-desc {
  font-size: 12.5px; line-height: 1.35; color: rgba(255,255,255,.85);
  position: relative; z-index: 1;
}
.foot { text-align: center; color: var(--muted); font-size: 10px; margin-top: 26px; letter-spacing: .5px; }
</style>
</head>
<body>

<div class="top">
  <h1>CEDISUR</h1>
  <p>LINKS · EQUIPO DE VENTAS</p>
</div>

<div class="wrap">
  <div id="status" class="status">Cargando tableros…</div>
  <div id="cards" class="cards"></div>
  <div class="foot">Inteligencia Comercial · Cedisur</div>
</div>

<script>
/* ============================================================
   FUENTE DE DATOS — Google Sheets publicado como CSV
   ------------------------------------------------------------
   Columnas de la planilla (fila 1):
      nombre , descripcion , vigencia , url , orden , ancho , tema , icono , icono_url

   - ancho:      1 (mitad de pantalla) o 2 (ancho completo)
   - tema:       vino | rojo | azul | violeta | verde | gris | blanco | naranja | dorado
   - icono:      estrella | pulso | rayo | lapiz  (si vacio, usa "estrella")
   - icono_url:  opcional, link a logo de marca. Si se completa, pisa al icono.
                 Acepta el link normal de "Compartir" de Google Drive
                 (debe estar configurado como "Cualquiera con el enlace").
   ============================================================ */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKlbXi7eQwkHWuqU9ynjSBZjYNm4PwNs6VtknRXOS-6Eboa1lJf0fNmXaduzr2u6oWaXcXD9cUDLFY/pub?gid=0&single=true&output=csv";

const DEMO = [
  { nombre: "Mundial Ferrero", descripcion: "Concurso de ventas · Ranking semanal por vendedor.", vigencia: "Jul – Ago 26", url: "https://ivanperillocedisur.github.io/cedisur-dashboard/mundial_ferrero_integrado.html", orden: 1, ancho: 1, tema: "vino", icono: "estrella" },
  { nombre: "Plan Crecimiento Paladini", descripcion: "Concurso de ventas · Ranking mensual por vendedor y zona.", vigencia: "Jul – Oct 26", url: "#", orden: 2, ancho: 1, tema: "rojo", icono: "pulso" },
  { nombre: "Desafío Semanal", descripcion: "Productos y ranking del desafío activo.", vigencia: "Renovación Semanal", url: "https://ivanperillocedisur.github.io/cedisur-dashboard/Desafio_Semanal_2026.html", orden: 3, ancho: 1, tema: "azul", icono: "rayo" },
  { nombre: "Activaciones y Trade Marketing", descripcion: "Pedidos y registros de activaciones.", vigencia: "Link Permanente", url: "#", orden: 4, ancho: 1, tema: "violeta", icono: "lapiz" },
  { nombre: "Manual de Marca", descripcion: "Lineamientos visuales y plantillas institucionales.", vigencia: "Referencia", url: "#", orden: 5, ancho: 1, tema: "blanco", icono: "lapiz" },
  { nombre: "Conexión McCain", descripcion: "Objetivos del mes: kg, clientes y fotos POP.", vigencia: "Agosto 26", url: "#", orden: 6, ancho: 1, tema: "naranja", icono: "estrella" },
  { nombre: "Mundial Ferrero Rocher", descripcion: "Ranking de ventas por vendedor y marca.", vigencia: "Concurso vigente", url: "#", orden: 7, ancho: 1, tema: "dorado", icono: "estrella" },
];

const TEMAS = {
  vino:    { fondo: "linear-gradient(135deg, #4A1010 0%, #7A2E1E 100%)" },
  rojo:    { fondo: "linear-gradient(135deg, #B71C1C 0%, #E53935 100%)" },
  azul:    { fondo: "linear-gradient(135deg, #1A3A8F 0%, #3D6FD9 100%)" },
  violeta: { fondo: "linear-gradient(135deg, #4A148C 0%, #7B3FB8 100%)" },
  verde:   { fondo: "linear-gradient(135deg, #1B5E20 0%, #43A047 100%)" },
  gris:    { fondo: "linear-gradient(135deg, #37474F 0%, #607D8B 100%)" },
  blanco:  {
    fondo: "linear-gradient(135deg, #FFFFFF 0%, #F1F2F4 100%)",
    texto_titulo: "#1A1D21",
    texto_desc: "#5A5F66",
    chip_fondo: "rgba(0,0,0,.06)",
    chip_texto: "#3A3D42",
    circulo: "rgba(0,0,0,.05)",
    icono_fondo: "rgba(0,0,0,.06)",
    icono_color: "#1A1D21",
    flecha_fondo: "rgba(0,0,0,.08)",
    flecha_color: "#1A1D21",
    sombra: "0 4px 14px rgba(0,0,0,.10)",
    borde: "1px solid #E4E5E8"
  },
  naranja: {
    fondo: "linear-gradient(135deg, #F57C00 0%, #FB8C00 100%)",
    texto_titulo: "#1A1206",
    texto_desc: "rgba(26,18,6,.75)",
    chip_fondo: "#FFC107",
    chip_texto: "#1A1206",
    circulo: "rgba(255,255,255,.14)",
    icono_fondo: "rgba(0,0,0,.14)",
    icono_color: "#1A1206",
    flecha_fondo: "#FFC107",
    flecha_color: "#1A1206",
    sombra: "0 4px 14px rgba(0,0,0,.15)",
    borde: "none"
  },
  dorado: {
    fondo: "linear-gradient(135deg, #B8860B 0%, #E8C158 55%, #C99A3A 100%)",
    texto_titulo: "#3A2400",
    texto_desc: "rgba(58,36,0,.78)",
    chip_fondo: "rgba(58,36,0,.16)",
    chip_texto: "#3A2400",
    circulo: "rgba(255,255,255,.20)",
    icono_fondo: "#FFFFFF",
    icono_color: "#3A2400",
    flecha_fondo: "rgba(58,36,0,.18)",
    flecha_color: "#3A2400",
    sombra: "0 4px 14px rgba(80,55,0,.25)",
    borde: "none"
  }
};
/* Valores por defecto para temas oscuros (no hace falta repetirlos arriba) */
const TEMA_DEFAULT = {
  texto_titulo: "#fff", texto_desc: "rgba(255,255,255,.85)",
  chip_fondo: "rgba(255,255,255,.20)", chip_texto: "#fff",
  circulo: "rgba(255,255,255,.10)",
  icono_fondo: "rgba(255,255,255,.16)", icono_color: "#fff",
  flecha_fondo: "rgba(255,255,255,.22)", flecha_color: "#fff",
  sombra: "0 4px 14px rgba(0,0,0,.12)", borde: "none"
};
function resolverTema(nombre) {
  const t = TEMAS[String(nombre||"").trim().toLowerCase()] || TEMAS.azul;
  return Object.assign({}, TEMA_DEFAULT, t);
}

const ICONOS = {
  estrella: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.4 7.1.6-5.4 4.6 1.7 6.9L12 17l-6.3 3.5 1.7-6.9L2 9l7.1-.6z"/></svg>',
  pulso:    '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 8 4-16 2 8h6"/></svg>',
  rayo:     '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  lapiz:    '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
};
/* Convierte un link "compartir" de Google Drive al formato de imagen directa.
   Detecta patrones como .../file/d/ID/view o .../open?id=ID */
function resolverUrlImagen(url) {
  if (!url) return url;
  if (!url.includes("drive.google.com")) return url;
  let id = null;
  let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) id = m[1];
  if (!id) { m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (m) id = m[1]; }
  if (!id) return url;
  return "https://drive.google.com/thumbnail?id=" + id + "&sz=w800";
}

function chevSVG(color) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="' + (color||"#fff") + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
}
/* Reemplaza el color de trazo (#fff) del SVG generico por el color del tema */
function fallbackConColor(svg, color) {
  return svg.replace(/#fff/g, color || "#fff");
}

function render(items) {
  items.sort((a,b) => (parseInt(a.orden)||99) - (parseInt(b.orden)||99));
  const cont = document.getElementById("cards");
  cont.innerHTML = "";
  items.forEach(it => {
    if (!it.nombre) return;
    const esAncho = String(it.ancho).trim() === "2";
    const tema = resolverTema(it.tema);
    const key = String(it.icono||"").trim().toLowerCase();
    const fallback = ICONOS[key] || ICONOS.estrella;

    const a = document.createElement("a");
    a.className = "card" + (esAncho ? " wide" : "");
    a.style.background = tema.fondo;
    a.style.boxShadow = tema.sombra;
    a.style.border = tema.borde;
    a.style.setProperty("--circulo", tema.circulo);
    a.href = it.url || "#";
    if ((it.url||"").startsWith("http")) a.target = "_blank";

    a.innerHTML =
      '<div class="card-icon" style="background:' + tema.icono_fondo + '"></div>' +
      '<div class="chev" style="background:' + tema.flecha_fondo + '">' + chevSVG(tema.flecha_color) + '</div>' +
      (it.vigencia ? '<span class="card-vig" style="background:' + tema.chip_fondo + ';color:' + tema.chip_texto + '">' + it.vigencia + '</span><br>' : '') +
      '<div class="card-title" style="color:' + tema.texto_titulo + '">' + it.nombre + '</div>' +
      (it.descripcion ? '<div class="card-desc" style="color:' + tema.texto_desc + '">' + it.descripcion + '</div>' : '');

    /* Icono/logo: se inserta como elemento real, con manejo de error seguro (sin conflicto de comillas) */
    const cajaIcono = a.querySelector(".card-icon");
    if (it.icono_url) {
      const img = document.createElement("img");
      img.src = resolverUrlImagen(it.icono_url);
      img.alt = "";
      img.onerror = function () { cajaIcono.innerHTML = fallbackConColor(fallback, tema.icono_color); };
      cajaIcono.appendChild(img);
    } else {
      cajaIcono.innerHTML = fallbackConColor(fallback, tema.icono_color);
    }

    cont.appendChild(a);
  });
  document.getElementById("status").style.display = "none";
}

function parseCSV(text) {
  const rows = [];
  const lines = text.replace(/\r/g,"").split("\n").filter(l => l.trim() !== "");
  const headers = splitLine(lines[0]).map(h =>
    h.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  );
  for (let i = 1; i < lines.length; i++) {
    const cells = splitLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => obj[h] = (cells[idx]||"").trim());
    rows.push(obj);
  }
  return rows;
}
function splitLine(line) {
  const out = []; let cur = ""; let q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { q = !q; }
    else if (c === "," && !q) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

async function load() {
  if (!SHEET_URL) { render(DEMO); return; }
  try {
    const r = await fetch(SHEET_URL);
    const txt = await r.text();
    const rows = parseCSV(txt);
    render(rows.length ? rows : DEMO);
  } catch (e) {
    document.getElementById("status").textContent = "No se pudo leer la planilla. Mostrando datos de ejemplo.";
    render(DEMO);
  }
}
load();
</script>
</body>
</html>
